<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Portali — Güncel Kadrolar ve Power Rankings</title>
<style>
  :root{
    --bg:#0b0e14; --card:#12161f; --card2:#171c27; --line:#242a38;
    --text:#eef1f6; --sub:#9aa4b6; --afc:#ef4444; --nfc:#3b82f6;
    --accent:#10b981; --gold:#f59e0b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:20px 14px 60px;
  }
  h1{font-size:1.45rem; text-align:center; margin:6px 0 2px; letter-spacing:-.02em;}
  p.sub{text-align:center; color:var(--sub); font-size:.84rem; margin:0 0 20px; line-height:1.5;}

  /* Tab Butonları */
  .tab-nav{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:24px;
  }
  .tab-btn{
    background:var(--card); border:1px solid var(--line); color:var(--sub);
    padding:8px 18px; border-radius:10px; font-weight:700; font-size:.84rem;
    cursor:pointer; transition:.15s;
  }
  .tab-btn:hover{background:var(--card2); color:var(--text);}
  .tab-btn.active{
    background:#2563eb; color:#fff; border-color:#3b82f6;
  }

  .tab-pane{display:none;}
  .tab-pane.active{display:block;}

  .conf-title{
    display:flex; align-items:center; gap:10px; margin:24px 0 14px;
    font-size:1.15rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
  }
  .conf-title .dot{width:12px; height:12px; border-radius:50%;}
  .conf-title.afc .dot{background:var(--afc); box-shadow:0 0 10px rgba(239,68,68,.5);}
  .conf-title.nfc .dot{background:var(--nfc); box-shadow:0 0 10px rgba(59,130,246,.5);}
  
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr));
    gap:10px; margin-bottom:28px;
  }
  .team{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 6px 10px; text-align:center; cursor:pointer;
    transition:transform .12s, border-color .12s, background .12s;
    display:flex; flex-direction:column; align-items:center;
  }
  .team:active{transform:scale(.96);}
  .team:hover{border-color:#3a4358; background:var(--card2);}
  .team .name{font-size:.7rem; color:var(--sub); line-height:1.25; font-weight:600;}

  /* Takım Rozetleri */
  .team-badge{
    width:46px; height:46px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:.82rem; letter-spacing:.05em;
    margin-bottom:8px; border:1px solid rgba(255,255,255,.15);
    box-shadow:0 4px 10px rgba(0,0,0,.35); flex-shrink:0;
  }
  .team-badge.sm{
    width:26px; height:26px; border-radius:7px; font-size:.64rem; margin-bottom:0;
  }
  .team-badge.lg{
    width:52px; height:52px; border-radius:14px; font-size:1rem; margin-bottom:0;
  }

  /* Alt Filtre Butonları */
  .sub-tabs{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:16px 0 20px;
  }
  .sub-btn{
    background:var(--card); border:1px solid var(--line); color:var(--sub);
    padding:7px 16px; border-radius:8px; font-size:.78rem; font-weight:600;
    cursor:pointer; transition:.15s;
  }
  .sub-btn:hover{color:var(--text);}
  .sub-btn.active{
    background:#1f2937; color:#38bdf8; border-color:#38bdf8;
  }

  .table-wrap{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; max-width:960px; margin:0 auto;
  }
  table{width:100%; border-collapse:collapse; font-size:.84rem;}
  thead th{
    text-align:left; padding:9px 14px; color:var(--sub); font-weight:600;
    font-size:.7rem; text-transform:uppercase; background:var(--card2);
  }
  tbody td{padding:10px 14px; border-top:1px solid var(--line); vertical-align:middle;}
  tbody tr:hover{background:var(--card2);}
  
  .rank-badge{
    display:inline-flex; width:24px; height:24px; border-radius:6px;
    align-items:center; justify-content:center; font-weight:800; font-size:.74rem;
    background:#1f2937; color:var(--text);
  }
  .rank-badge.top3{background:var(--gold); color:#000;}
  .flex-cell{display:flex; align-items:center; gap:9px;}
  .pname{font-weight:600;}
  .ppos{color:var(--sub); font-size:.74rem; margin-top:1px;}

  .tier{
    font-size:.66rem; font-weight:700; padding:2px 7px; border-radius:6px;
    display:inline-block;
  }
  .tier-c{background:#166534; color:#86efac;}
  .tier-p{background:#1e40af; color:#93c5fd;}
  .tier-b{background:#854d0e; color:#fde047;}

  /* Modal Stilleri */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.75);
    z-index:50; padding:14px; overflow-y:auto;
  }
  .overlay.show{display:block;}
  .modal{
    max-width:760px; margin:20px auto 50px; background:var(--card);
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
  }
  .modal-head{
    display:flex; align-items:center; gap:14px; padding:16px 18px;
    border-bottom:1px solid var(--line); position:sticky; top:0;
    background:var(--card); z-index:2;
  }
  .modal-head .mh-text{flex:1;}
  .modal-head h2{margin:0; font-size:1.15rem;}
  .modal-head .cap{font-size:.75rem; color:var(--sub); margin-top:3px;}
  .close-btn{
    background:var(--card2); border:1px solid var(--line); color:var(--text);
    width:34px; height:34px; border-radius:50%; font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .section-label{
    font-size:.74rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--sub); padding:14px 18px 8px; font-weight:800;
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,.02);
  }
  .badge{
    display:inline-block; font-size:.65rem; padding:2px 7px; border-radius:6px;
    font-weight:700;
  }
  .badge-offense{background:#991b1b; color:#fecaca;}
  .badge-defense{background:#1e40af; color:#bfdbfe;}
  .badge-st{background:#065f46; color:#a7f3d0;}
  .jersey-pill{
    display:inline-block; font-size:.68rem; font-weight:700;
    background:#1f2937; color:#38bdf8; padding:2px 6px; border-radius:4px; margin-right:6px;
  }
</style>
</head>

function renderBadge(abbr, size="normal"){
  const c = TEAM_COLORS[abbr] || { p:"#242a38", s:"#3a4358", t:"#ffffff" };
  const sizeClass = size==="large" ? "team-badge lg" : (size==="small" ? "team-badge sm" : "team-badge");
  return `
    <div class="${sizeClass}" style="background: linear-gradient(135deg, ${c.p} 0%, ${c.s} 100%); color: ${c.t};">
      ${abbr.toUpperCase()}
    </div>
  `;
}

function switchMainTab(tabId, btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`tab-${tabId}`).classList.add('active');
  if(tabId==='rankings') renderTeamRankings();
}

function switchRankSub(type, btn){
  document.querySelectorAll('#tab-rankings .sub-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(type==='teams') renderTeamRankings();
  else renderPositionRankings(type);
}

function renderTeamRankings(){
  const container = document.getElementById('rankings-container');
  const rows = TEAM_POWER_RANKINGS.map(t=>{
    const tierClass = t.tier.includes('Favorisi') ? 'tier-c' : (t.tier.includes('Tehdidi') ? 'tier-p' : 'tier-b');
    return `
      <tr>
        <td style="width:50px; text-align:center;">
          <span class="rank-badge ${t.rank<=3?'top3':''}">${t.rank}</span>
        </td>
        <td>
          <div class="flex-cell">
            ${renderBadge(t.abbr, 'small')}
            <span class="pname">${t.name}</span>
            <span style="font-size:.7rem; color:var(--sub);">(${t.conf})</span>
          </div>
        </td>
        <td><span class="tier ${tierClass}">${t.tier}</span></td>
        <td style="font-size:.76rem; color:var(--sub);">${t.note}</td>
      </tr>
    `;
  }).join('');

  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th style="text-align:center;">Sıra</th>
          <th>Takım</th>
          <th>Seviye / Statü</th>
          <th>Genel Analiz & Görünüm</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderPositionRankings(posKey){
  const list = POSITION_RANKINGS[posKey];
  const container = document.getElementById('rankings-container');
  const titles = {
    QB: "Quarterback (Oyun Kurucu)",
    RB: "Running Back (Koşucu)",
    DEF: "En İyi Defans Oyuncuları (EDGE / DT / LB / CB / S)"
  };
  
  const rows = list.map(p=>`
    <tr>
      <td style="width:50px; text-align:center;">
        <span class="rank-badge ${p.rank<=3?'top3':''}">${p.rank}</span>
      </td>
      <td>
        <div class="pname">${p.name}</div>
        <div class="ppos">${titles[posKey]}</div>
      </td>
      <td>
        <div class="flex-cell">
          ${renderBadge(p.abbr, 'small')}
          <span style="font-size:.78rem; font-weight:600;">${p.team}</span>
        </div>
      </td>
      <td style="font-size:.76rem; color:var(--sub);">${p.meta}</td>
    </tr>
  `).join('');

  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th style="text-align:center;">Sıra</th>
          <th>Oyuncu</th>
          <th>Takım</th>
          <th>Oyun Stili / Nitelik</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function buildGrid(list, containerId){
  const el = document.getElementById(containerId);
  list.forEach(t=>{
    const div = document.createElement('div');
    div.className='team';
    div.onclick=()=>openModal(t);
    div.innerHTML = `
      ${renderBadge(t.abbr)}
      <div class="name">${t.name}</div>
    `;
    el.appendChild(div);
  });
}
buildGrid(NFL_STRUCTURE.afc,'afc-grid');
buildGrid(NFL_STRUCTURE.nfc,'nfc-grid');

function makeRosterRows(players){
  if(!players || players.length === 0){
    return `<tr><td colspan="2" style="color:var(--sub); text-align:center; padding:12px;">Kadro verisi bulunamadı.</td></tr>`;
  }
  return players.map(p=>`
    <tr>
      <td>
        <div class="pname">
          ${p.jersey && p.jersey !== '--' ? `<span class="jersey-pill">#${p.jersey}</span>` : ''}
          ${p.n}
        </div>
        <div class="ppos">Pozisyon: <b>${p.p}</b></div>
      </td>
      <td style="color:var(--sub); font-size:.78rem; text-align:right;">
        ${p.experience > 0 ? `${p.experience} Yıl Deneyim` : 'Çaylak (Rookie)'}
      </td>
    </tr>
  `).join('');
}

function openModal(t){
  const modal = document.getElementById('modal');
  
  // Kazınan JSON'dan takımı çek
  const rawData = typeof NFL_ROSTER_DATA !== 'undefined' ? (NFL_ROSTER_DATA[t.abbr] || NFL_ROSTER_DATA[t.abbr === 'wsh' ? 'was' : t.abbr]) : null;
  
  const offense = rawData?.offense || [];
  const defense = rawData?.defense || [];
  const special = rawData?.special || [];

  modal.innerHTML = `
    <div class="modal-head">
      ${renderBadge(t.abbr, 'large')}
      <div class="mh-text">
        <h2>${t.name}</h2>
        <div class="cap">Divizyon: <b>${t.div}</b> · Toplam Kadro: <b>${offense.length + defense.length + special.length} Oyuncu</b></div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    
    <!-- 1. KADRO: OFANS -->
    <div class="section-label">
      1. Ofans Kadrosu (${offense.length} Oyuncu)
      <span class="badge badge-offense">Hücum</span>
    </div>
    <table>
      <thead><tr><th>Oyuncu</th><th style="text-align:right;">Deneyim</th></tr></thead>
      <tbody>${makeRosterRows(offense)}</tbody>
    </table>

    <!-- 2. KADRO: DEFANS -->
    <div class="section-label">
      2. Defans Kadrosu (${defense.length} Oyuncu)
      <span class="badge badge-defense">Savunma</span>
    </div>
    <table>
      <thead><tr><th>Oyuncu</th><th style="text-align:right;">Deneyim</th></tr></thead>
      <tbody>${makeRosterRows(defense)}</tbody>
    </table>

    <!-- 3. KADRO: ÖZEL TAKIM -->
    <div class="section-label">
      3. Özel Takım (${special.length} Oyuncu)
      <span class="badge badge-st">Special Teams</span>
    </div>
    <table>
      <thead><tr><th>Oyuncu</th><th style="text-align:right;">Deneyim</th></tr></thead>
      <tbody>${makeRosterRows(special)}</tbody>
    </table>
  `;
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
}
</script>
