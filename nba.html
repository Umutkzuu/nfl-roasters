<style>
  :root{
    --bg:#0b0e14; --card:#12161f; --card2:#171c27; --line:#242a38;
    --text:#eef1f6; --sub:#9aa4b6; --east:#3b82f6; --west:#f97316;
    --accent:#22c55e; --gold:#f59e0b; --purple:#a855f7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:20px 14px 60px;
  }
  h1{font-size:1.35rem; text-align:center; margin:6px 0 2px;}
  p.sub{text-align:center; color:var(--sub); font-size:.82rem; margin:0 0 16px; line-height:1.5;}

  /* Tab Nav */
  .tab-nav{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:24px;
  }
  .tab-btn{
    background:var(--card); border:1px solid var(--line); color:var(--sub);
    padding:8px 16px; border-radius:10px; font-weight:700; font-size:.82rem;
    cursor:pointer; transition:.15s;
  }
  .tab-btn:hover{background:var(--card2); color:var(--text);}
  .tab-btn.active{
    background:#2563eb; color:#fff; border-color:#3b82f6;
  }

  .tab-pane{display:none;}
  .tab-pane.active{display:block;}

  .conf-title{
    display:flex; align-items:center; gap:10px; margin:24px 0 14px;
    font-size:1.05rem; font-weight:700;
  }
  .conf-title .dot{width:10px;height:10px;border-radius:50%;}
  .conf-title.east .dot{background:var(--east);}
  .conf-title.west .dot{background:var(--west);}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:10px;
  }
  .team{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 6px 10px; text-align:center; cursor:pointer;
    transition:transform .12s, border-color .12s, background .12s;
    display:flex; flex-direction:column; align-items:center;
  }
  .team:active{transform:scale(.95);}
  .team:hover{border-color:#3a4358; background:var(--card2);}
  .team .name{font-size:.68rem; color:var(--sub); line-height:1.2; font-weight:600;}

  /* Takım Rozetleri */
  .team-badge{
    width:44px; height:44px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.82rem; letter-spacing:.05em;
    margin-bottom:8px; border:1px solid rgba(255,255,255,.15);
    box-shadow:0 4px 10px rgba(0,0,0,.35); flex-shrink:0;
  }
  .team-badge.sm{
    width:24px; height:24px; border-radius:6px; font-size:.62rem; margin-bottom:0;
  }
  .team-badge.lg{
    width:46px; height:46px; border-radius:13px; font-size:.92rem; margin-bottom:0;
  }

  /* Alt Filtre Butonları */
  .sub-tabs{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:16px 0 20px;
  }
  .sub-btn{
    background:var(--card); border:1px solid var(--line); color:var(--sub);
    padding:6px 14px; border-radius:8px; font-size:.76rem; font-weight:600;
    cursor:pointer; transition:.15s;
  }
  .sub-btn:hover{color:var(--text);}
  .sub-btn.active{
    background:#1f2937; color:#38bdf8; border-color:#38bdf8;
  }

  .table-wrap{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; max-width:920px; margin:0 auto;
  }
  .rank-badge{
    display:inline-flex; width:24px; height:24px; border-radius:6px;
    align-items:center; justify-content:center; font-weight:800; font-size:.72rem;
    background:#1f2937; color:var(--text);
  }
  .rank-badge.top3{background:var(--gold); color:#000;}
  .flex-cell{display:flex; align-items:center; gap:8px;}

  /* Draft Tablo Stilleri */
  .draft-tag{
    display:inline-block; font-size:.68rem; font-weight:700;
    padding:2px 7px; border-radius:6px; margin:2px 2px 2px 0;
  }
  .tag-first{background:#1e3a8a; color:#93c5fd; border:1px solid #2563eb;}
  .tag-swap{background:#581c87; color:#e9d5ff; border:1px solid #7e22ce;}
  .draft-count{
    font-size:.75rem; font-weight:800; color:var(--gold);
  }

  /* Modal Stilleri */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.72);
    z-index:50; padding:14px; overflow-y:auto;
  }
  .overlay.show{display:block;}
  .modal{
    max-width:700px; margin:20px auto 40px; background:var(--card);
    border:1px solid var(--line); border-radius:16px; overflow:hidden;
  }
  .modal-head{
    display:flex; align-items:center; gap:12px; padding:16px 16px 14px;
    border-bottom:1px solid var(--line); position:sticky; top:0;
    background:var(--card); z-index:2;
  }
  .modal-head .mh-text{flex:1;}
  .modal-head h2{margin:0; font-size:1.05rem;}
  .modal-head .cap{font-size:.72rem; color:var(--sub); margin-top:2px;}
  .close-btn{
    background:var(--card2); border:1px solid var(--line); color:var(--text);
    width:32px; height:32px; border-radius:50%; font-size:1rem; cursor:pointer;
    flex-shrink:0;
  }
  .section-label{
    font-size:.7rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--sub); padding:14px 16px 6px; font-weight:700;
    display:flex; justify-content:space-between; align-items:center;
  }
  table{width:100%; border-collapse:collapse; font-size:.82rem;}
  thead th{
    text-align:left; padding:8px 14px; color:var(--sub); font-weight:600;
    font-size:.68rem; text-transform:uppercase; background:var(--card2);
  }
  tbody td{padding:9px 14px; border-top:1px solid var(--line); vertical-align:middle;}
  tbody tr:hover{background:var(--card2);}
  .pname{font-weight:600; display:flex; align-items:center; gap:6px;}
  .ppos{color:var(--sub); font-size:.72rem;}
  .tier{
    font-size:.65rem; font-weight:700; padding:2px 6px; border-radius:6px;
    display:inline-block;
  }
  .tier-c{background:#166534; color:#86efac;}
  .tier-p{background:#1e40af; color:#93c5fd;}
  .tier-b{background:#854d0e; color:#fde047;}
  .badge{
    display:inline-block; font-size:.62rem; padding:1px 6px; border-radius:6px;
    background:#1f2937; color:#a5b4fc; font-weight:600;
  }
  .modal-draft-box{
    padding:10px 16px 14px; border-top:1px solid var(--line);
    font-size:.78rem; line-height:1.6;
  }
  .jersey-pill{
    display:inline-block; font-size:.66rem; font-weight:700;
    background:#1f2937; color:#38bdf8; padding:1px 5px; border-radius:4px;
  }
</style>

function renderBadge(abbr, size="normal"){
  const c = TEAM_COLORS[abbr] || { p:"#242a38", s:"#3a4358", t:"#ffffff" };
  const sizeClass = size==="large" ? "team-badge lg" : (size==="small" ? "team-badge sm" : "team-badge");
  return `
    <div class="${sizeClass}" style="background: linear-gradient(135deg, ${c.p} 0%, ${c.s} 100%); color: ${c.t};">
      ${abbr.toUpperCase()}
    </div>
  `;
}

function switchMainTab(tabId, btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`tab-${tabId}`).classList.add('active');
  if(tabId==='rankings') renderTeamRankings();
  if(tabId==='draft') renderDraftTable('all');
}

function switchRankSub(type, btn){
  document.querySelectorAll('#tab-rankings .sub-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(type==='teams') renderTeamRankings();
  else renderPositionRankings(type);
}

function renderTeamRankings(){
  const container = document.getElementById('rankings-container');
  const rows = TEAM_POWER_RANKINGS.map(t=>{
    const tierClass = t.tier.includes('Şampiyonluk') ? 'tier-c' : (t.tier.includes('Playoff') ? 'tier-p' : 'tier-b');
    return `
      <tr>
        <td style="width:50px; text-align:center;">
          <span class="rank-badge ${t.rank<=3?'top3':''}">${t.rank}</span>
        </td>
        <td>
          <div class="flex-cell">
            ${renderBadge(t.abbr, 'small')}
            <span class="pname">${t.name}</span>
            <span style="font-size:.7rem; color:var(--sub);">(${t.conf})</span>
          </div>
        </td>
        <td><span class="tier ${tierClass}">${t.tier}</span></td>
        <td style="font-size:.75rem; color:var(--sub);">${t.note}</td>
      </tr>
    `;
  }).join('');

  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th style="text-align:center;">Sıra</th>
          <th>Takım</th>
          <th>Statü</th>
          <th>Analiz & Beklenti</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderPositionRankings(posKey){
  const list = POSITION_RANKINGS[posKey];
  const container = document.getElementById('rankings-container');
  const posNames = { PG:"Point Guard (Oyun Kurucu)", SG:"Shooting Guard (Şutör Gard)", SF:"Small Forward (Kısa Forvet)", PF:"Power Forward (Uzun Forvet)", C:"Center (Pivot)" };
  
  const rows = list.map(p=>`
    <tr>
      <td style="width:50px; text-align:center;">
        <span class="rank-badge ${p.rank<=3?'top3':''}">${p.rank}</span>
      </td>
      <td>
        <div class="pname">${p.name}</div>
        <div class="ppos">${posNames[posKey]}</div>
      </td>
      <td>
        <div class="flex-cell">
          ${renderBadge(p.abbr, 'small')}
          <span style="font-size:.78rem; font-weight:600;">${p.team}</span>
        </div>
      </td>
      <td style="font-size:.75rem; color:var(--sub);">${p.meta}</td>
    </tr>
  `).join('');

  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th style="text-align:center;">Sıra</th>
          <th>Oyuncu</th>
          <th>Takım</th>
          <th>Oyuncu Profili / Güçlü Yön</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function filterDraftTable(filterType, btn){
  document.querySelectorAll('#tab-draft .sub-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderDraftTable(filterType);
}

function renderDraftTable(filter='all'){
  const container = document.getElementById('draft-container');
  const allTeams = [...TEAMS_STRUCTURE.east.map(t=>({...t, conf:"Doğu"})), ...TEAMS_STRUCTURE.west.map(t=>({...t, conf:"Batı"}))];
  
  let list = allTeams.map(t=>{
    const d = TEAM_DRAFT_ASSETS[t.abbr] || { totalFirsts:0, totalSeconds:0, summary:"—", picks:[] };
    return { ...t, ...d };
  });

  if(filter==='rich') list = list.filter(t=>t.totalFirsts>=5);
  if(filter==='east') list = list.filter(t=>t.conf==='Doğu');
  if(filter==='west') list = list.filter(t=>t.conf==='Batı');

  list.sort((a,b)=>b.totalFirsts - a.totalFirsts);

  const rows = list.map((t, idx)=>`
    <tr>
      <td style="width:40px; text-align:center;">
        <span class="rank-badge">${idx+1}</span>
      </td>
      <td>
        <div class="flex-cell">
          ${renderBadge(t.abbr, 'small')}
          <div>
            <div class="pname">${t.name}</div>
            <div style="font-size:.68rem; color:var(--sub);">${t.conf}</div>
          </div>
        </div>
      </td>
      <td style="text-align:center;">
        <span class="draft-count">${t.totalFirsts}</span>
        <div style="font-size:.65rem; color:var(--sub);">${t.totalSeconds} Adet 2. Tur</div>
      </td>
      <td>
        <div style="margin-bottom:4px;">
          ${t.picks.map(p=>`<span class="draft-tag ${p.includes('Swap')?'tag-swap':'tag-first'}">${p}</span>`).join('')}
        </div>
        <div style="font-size:.7rem; color:var(--sub);">${t.summary}</div>
      </td>
    </tr>
  `).join('');

  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th style="text-align:center;">#</th>
          <th>Takım</th>
          <th style="text-align:center;">1. Tur Hakkı</th>
          <th>Gelecek Draft Detayları & Haklar (2027–2031)</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function buildGrid(list, containerId){
  const el = document.getElementById(containerId);
  list.forEach(t=>{
    const div = document.createElement('div');
    div.className='team';
    div.onclick=()=>openModal(t);
    div.innerHTML = `
      ${renderBadge(t.abbr)}
      <div class="name">${t.name}</div>
    `;
    el.appendChild(div);
  });
}
buildGrid(TEAMS_STRUCTURE.east,'east-grid');
buildGrid(TEAMS_STRUCTURE.west,'west-grid');

function renderLiveRosterRows(players){
  if(!players || players.length === 0){
    return `<tr><td colspan="3" style="color:var(--sub); text-align:center; padding:12px;">Kadro verisi bulunamadı.</td></tr>`;
  }
  return players.map(p=>`
    <tr>
      <td>
        <div class="pname">
          ${p.jersey && p.jersey !== '--' ? `<span class="jersey-pill">#${p.jersey}</span>` : ''}
          ${p.n}
        </div>
        <div class="ppos">Pozisyon: <b>${p.p}</b></div>
      </td>
      <td style="color:var(--sub); font-size:.74rem;">
        ${p.height} · ${p.weight}
      </td>
      <td style="color:var(--sub); font-size:.74rem; text-align:right;">
        ${p.experience > 0 ? `${p.experience} Yıl` : 'Çaylak (R)'}
      </td>
    </tr>
  `).join('');
}

function openModal(t){
  const modal = document.getElementById('modal');
  const d = TEAM_DRAFT_ASSETS[t.abbr] || { totalFirsts:0, totalSeconds:0, summary:"Bilgi yok", picks:[] };
  
  // ESPN'den çekilen canlı kadroyu al
  const liveData = typeof NBA_ROSTER_DATA !== 'undefined' ? NBA_ROSTER_DATA[t.abbr] : null;
  const players = liveData?.roster || [];

  modal.innerHTML = `
    <div class="modal-head">
      ${renderBadge(t.abbr, 'large')}
      <div class="mh-text">
        <h2>${t.name}</h2>
        <div class="cap">Aktif Kadro: <b>${players.length} Oyuncu</b> · Toplam 1. Tur Hakkı: <b>${d.totalFirsts}</b></div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    
    <div class="section-label">Gelecek Draft Sermayesi (2027–2031) <span class="badge" style="background:#2563eb; color:#fff;">Draft Assets</span></div>
    <div class="modal-draft-box">
      <div style="margin-bottom:6px;">
        ${d.picks.map(p=>`<span class="draft-tag ${p.includes('Swap')?'tag-swap':'tag-first'}">${p}</span>`).join('')}
      </div>
      <div style="color:var(--sub); font-size:.73rem;">${d.summary} (Ayrıca ${d.totalSeconds} adet 2. tur seçimi).</div>
    </div>

    <div class="section-label">Güncel Aktif Kadro <span class="badge">ESPN Live Roster</span></div>
    <table>
      <thead>
        <tr>
          <th>Oyuncu</th>
          <th>Fizik (Boy / Kilo)</th>
          <th style="text-align:right;">Deneyim</th>
        </tr>
      </thead>
      <tbody>${renderLiveRosterRows(players)}</tbody>
    </table>
  `;
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
}
